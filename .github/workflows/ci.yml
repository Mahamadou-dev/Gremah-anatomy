name: CI

# Une seule voie vers `main` : tout ce qui suit doit passer sur la branche de
# sprint avant la fusion (SPRINT.md, « Rituel de clôture »). La protection de
# branche côté GitHub exige le job `verify`.
on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur une branche annule la vérification précédente : sur un
# palier gratuit, laisser tourner des builds périmés retarde ceux qui comptent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      # Invariants du moteur (frontière React, FIT_SIZE, render-on-demand, double
      # chemin de rendu), frontière serveur des comptes et provenance des modèles.
      # Ils cassent avant le build, pas après.
      - run: npm test

      # Budget **par structure** et non global (Sprint 12) : un plafond sur
      # `public/models` entier aurait cassé vers la dixième structure importée,
      # alors que la borne qui compte pour l'étudiant est ce qu'il télécharge
      # pour une structure — 2 Mo, tous niveaux de détail confondus.
      - run: npm run models:check

      - run: npm run build

      # Le livrable n'est plus un export statique depuis le Sprint 11 (quatre
      # routes de compte, CLAUDE.md §2 bis) : on vérifie donc que les pages sont
      # bien prérendues par `next build`, et que les routes d'API existent.
      - name: Vérifier la sortie de build
        run: |
          test -d .next || { echo "::error::.next manquant — le build n'a rien produit"; exit 1; }
          for page in index a-propos credits; do
            find .next/server/app -name "${page}.html" -print -quit | grep -q . \
              || { echo "::error::page /${page} non prérendue"; exit 1; }
          done
        shell: bash

  # Sprint 14 : le livrable de ce sprint est cette chaîne elle-même — jusqu'ici
  # rien ne lançait l'application dans un vrai navigateur, un écran noir ou un
  # parcours d'inscription cassé sortaient donc sans qu'aucun garde-fou bronche.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Playwright (smoke + parcours de compte)
        run: npm run e2e
        env:
          # Tant que ces deux secrets ne sont pas posés côté dépôt GitHub
          # (Settings → Secrets → Actions), les tests de e2e/comptes.spec.ts
          # se sautent proprement — voir SPRINT.md, « À faire à la main » — et
          # seuls les smokes publics de e2e/smoke.spec.ts tournent.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Auditer les dépendances sépare deux échecs qui ne se traitent pas pareil :
  # une régression du code se corrige dans la PR, une faille amont se planifie.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
